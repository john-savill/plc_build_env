name: Structured Text CI/CD

on:
  # 1. Trigger for immediate validation on every commit/PR
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  
  # 2. Trigger for scheduled daily build/verify
  schedule:
    # Example: Runs every day at midnight UTC
    - cron: '0 0 * * *' 

jobs:
  # 1. Validation Stage
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Structured Text Requirements
        # Use a simple Bash script to check for the required tag format
        run: |
          echo "Starting structured text validation..."
          
          ST_FILES=$(find src -name "*.st")
          IECST_FILES=$(find src -name "*.iecst")
          
          ALL_FILES=($ST_FILES $IECST_FILES)
          
          if [ ${#ALL_FILES[@]} -eq 0 ]; then
            echo "No .st or .iecst files found in the /src directory. Skipping validation."
          else
            VALIDATION_FAILED=false
            for file in "${ALL_FILES[@]}"; do
              echo "Checking file: $file"
              if ! grep -q '\[SWR-.*-' "$file"; then
                echo "Validation FAILED in file: $file - Missing required tag format [SWR-(Project_name)-(requirement_number)]"
                VALIDATION_FAILED=true
              fi
            done

            if $VALIDATION_FAILED; then
              echo "--- Validation FAILED. Please fix the missing tags before proceeding. ---"
              exit 1 # Exit with an error code to fail the job
            else
              echo "All structured text files passed the requirement tag validation."
            fi
          fi

  # 2. Build Stage (Placeholder)
  build:
    runs-on: ubuntu-latest
    needs: validate # Ensure build only runs if validation passes
    if: github.event_name == 'schedule'
    steps:
